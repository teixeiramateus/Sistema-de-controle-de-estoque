<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar produtos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Adicionar novos produtos ao estoque</h1>
    <h2>informações do produto:</h2>
    <form action="/adicionarproduto" method="POST">
        <label for="nome">Nome do produto:</label>
        <input type="text" id="nome" name="nome" required><br><br>

        <label for="quantidade">Estoque inicial:</label>
        <input type="number" id="quantidade" name="quantidade" required><br><br>

        <label for="estoqueMedio">Estoque médio:</label>
        <input type="number" step="0.01" id="estoqueMedio" name="estoqueMedio" required><br><br>

        <input type="submit" value="Adicionar Produto">
</body>
</html>
